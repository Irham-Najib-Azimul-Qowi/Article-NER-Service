<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ekstraksi Entitas Berita</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <h1>Ekstraksi Entitas Berita</h1>
    <p class="server" id="server-status" aria-live="polite">Memeriksa server…</p>
  </header>

  <main class="layout">
    <section class="panel" aria-labelledby="input-heading">
      <h2 id="input-heading">Artikel</h2>

      <div class="samples">
        <span class="hint">Isi dengan contoh:</span>
        <button type="button" class="link" data-sample="hockey">Berita hoki</button>
        <button type="button" class="link" data-sample="bank">Berita bank</button>
      </div>

      <div class="field">
        <div class="field-head">
          <label for="title">Judul</label>
          <span class="count" id="title-count">0 / 500</span>
        </div>
        <input id="title" type="text" maxlength="500" autocomplete="off">
      </div>

      <div class="field">
        <div class="field-head">
          <label for="body">Isi berita</label>
          <span class="count" id="body-count">0 karakter</span>
        </div>
        <textarea id="body" rows="12"></textarea>
      </div>

      <p class="error" id="error" role="alert" hidden></p>

      <div class="actions">
        <button type="button" class="primary" id="analyze">Cari entitas</button>
        <button type="button" class="secondary" id="clear">Kosongkan</button>
        <span class="hint">Ctrl + Enter untuk menjalankan</span>
      </div>
    </section>

    <section class="panel" aria-labelledby="result-heading">
      <h2 id="result-heading">Hasil</h2>

      <p class="empty" id="empty">Hasil akan tampil di sini setelah artikel dianalisis.</p>

      <div id="result" hidden>
        <p class="summary" id="summary"></p>
        <div class="chips" id="chips" role="group" aria-label="Filter kategori"></div>
        <p class="note" id="note" hidden></p>
        <div class="reading" id="text" tabindex="0" aria-label="Teks artikel dengan entitas disorot"></div>

        <h3>Daftar entitas</h3>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th scope="col">Teks</th><th scope="col">Kategori</th><th scope="col">Posisi</th></tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
